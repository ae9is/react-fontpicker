# Workflow to cleanup old deployments.

name: cleanup-deployments

on:
  # Manual run from GitHub UI
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
        deployments: write

    steps:
      - name: 🗑 Delete build-fonts deployments
        # strumwolf/delete-deployment-environment@v3.0.0
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: build-fonts
          onlyRemoveDeployments: true

      - name: 🗑 Delete github-pages deployments
        # strumwolf/delete-deployment-environment@v3.0.0
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true

      - name: 🗑 Delete publish deployments
        # strumwolf/delete-deployment-environment@v3.0.0
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: publish
          onlyRemoveDeployments: true
